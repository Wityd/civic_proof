server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Northflank health check
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets never change: cache for a year.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single-page app: every unknown path serves index.html so React Router
    # handles /projects/CP001, /review, … on refresh (same as vercel.json).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
